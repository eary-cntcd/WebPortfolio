<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess my birthday</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="gameTitle">Guess my birthday</h1>

    <div class="grid-container" id="mainGrid">
    </div>

    <div id="setContainer" class="set-container">
        <p id="setNumber" style="display: none;"></p>
        <div class="answer-buttons">
            <button id="yesAnswer" class="yes">Yes</button>
            <button id="noAnswer" class="no">No</button>
        </div>
    </div>

    <div id="finalResultContainer">
        <div id="finalResult"></div>
        <button id="playAgainBtn">Play Again</button>
    </div>

    <script src="script.js"></script>

</body>
</html>
